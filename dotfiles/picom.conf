###############################################################################
#                           PICOM CONFIGURATION (v13)                         #
#                                                                             #
# Fully compatible with Picom v13 rule-based syntax.                          #
# - Active opacity: 0.98 (via rule: focused)                                  #
# - Inactive opacity: 0.92 (via rule: !focused)                               #
# - Backend: xrender (VM / software / broad compatibility)                    #
# - Fast animations and background blur fallback                              #
###############################################################################

#################################
#           Backend             #
#################################

# Backend to use: `xrender` (safe default for VMs/general use) or `egl` (if built with USE=opengl).
backend = "xrender";

# Enable/disable VSync to eliminate screen tearing.
vsync = true;

# Use EWMH '_NET_ACTIVE_WINDOW' to determine currently focused window.
use-ewmh-active-win = true;

# Use 'Damage' extension for rendering only dirty regions (improves performance).
use-damage = true;

# Log level ('debug', 'info', 'warn', 'error').
log-level = "warn";

#################################
#           Fading              #
#################################

# Fade windows in/out when opening/closing and when opacity changes.
fading = true;

# Opacity change between steps while fading in (default: 0.03).
fade-in-step = 0.03;

# Opacity change between steps while fading out (default: 0.03).
fade-out-step = 0.03;

# The time between steps in fade step, in milliseconds.
fade-delta = 10;

# Do not fade on window open/close.
no-fading-openclose = false;

#################################
#           Shadows             #
#################################

# Enabled client-side shadows on windows.
shadow = true;

# The blur radius for shadows, in pixels (default: 12).
shadow-radius = 12;

# The opacity of shadows (0.0 - 1.0, default: 0.75).
shadow-opacity = 0.75;

# The left offset for shadows, in pixels.
shadow-offset-x = -12;

# The top offset for shadows, in pixels.
shadow-offset-y = -12;

#################################
#           Corners             #
#################################

# Sets the radius of rounded window corners (0 disables rounding).
corner-radius = 0;

#################################
#     Background Blurring       #
#################################

# Blur kernel for xrender backend (simple 3x3 box blur).
# Note: For dual_kawase blur, recompile picom with USE=opengl and set backend="egl".
blur-kern = "3x3box";

#################################
#          Animations           #
#################################

# Picom 13 animation presets (triggers: "open", "close", "show", "hide", "geometry").
animations = (
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.20;
    scale = 0.95;
  },
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.20;
    scale = 0.95;
  },
  {
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.25;
  }
);

#################################
#         Window Rules          #
#################################

# In Picom v13, opacity, blur, shadows, and animation overrides are defined in `rules`.
rules: (
  # 1. Active / Focused window opacity: 0.98
  {
    match = "focused";
    opacity = 0.98;
  },

  # 2. Inactive / Unfocused window opacity: 0.92
  {
    match = "!focused";
    opacity = 0.92;
  },

  # 3. Full opacity for video players, browsers, and media viewers
  {
    match = "class_g = 'mpv' || "
            "class_g = 'vlc' || "
            "class_g = 'firefox' || "
            "class_g = 'Chromium'";
    opacity = 1.0;
  },

  # 4. No shadows or blur on docks, desktop, drag-and-drop, and GTK frames
  {
    match = "window_type = 'dock' || "
            "window_type = 'desktop' || "
            "window_type = 'dnd' || "
            "name = 'Notification' || "
            "class_g ?= 'Notify-osd' || "
            "class_g = 'Dunst' || "
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
    blur-background = false;
  },

  # 5. Instant display for menus, dropdowns, and tooltips (no fade/animations)
  {
    match = "window_type = 'popup_menu' || "
            "window_type = 'dropdown_menu' || "
            "window_type = 'tooltip' || "
            "window_type = 'menu'";
    fade = false;
    animations = false;
    shadow = true;
    opacity = 0.98;
  },

  # 6. Disable effects on lock screens and screen capture tools
  {
    match = "class_g = 'slock' || "
            "class_g = 'i3lock' || "
            "class_g = 'flameshot'";
    animations = false;
    shadow = false;
    blur-background = false;
    opacity = 1.0;
  }
);
